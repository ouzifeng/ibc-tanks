<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1"/><meta http-equiv="X-UA-Compatible" content="ie=edge"/><title>Browse Products | IBC Tanks Canada B2B Portal</title><link rel="icon" href="/ibc-tanks-demo/favicon-ibc.png"><link href="/ibc-tanks-demo/style.css" rel="stylesheet"></head><body x-data="{

      'loaded': true,
      'darkMode': false,
      'cartCount': 3,
      'user': {
        name: 'Tom Bradley',
        email: 'tom.bradley@dartscorner.co.uk',
        company: 'Darts Corner',
        role: 'Buyer'
      },
      'selectedCategory': 'all',
      'sortBy': 'name',
      'viewMode': 'grid',
      'products': [
        { id: 1, name: '1000L Reconditioned IBC Tote', sku: 'RCN-1000-BV', price: 245.00, image: './images/product/ibc/rcn-1000-400x400.jpg', category: 'Reconditioned IBC Totes', stock: 150, unit: 'Each' },
        { id: 2, name: '1250L Reconditioned IBC Tote', sku: 'RCN-1250-BV', price: 285.00, image: './images/product/ibc/rcn-1250-400x400.jpg', category: 'Reconditioned IBC Totes', stock: 85, unit: 'Each' },
        { id: 3, name: '1000L New IBC Tote', sku: 'NEW-1000', price: 425.00, image: './images/product/ibc/new-1000-400x400.jpg', category: 'New IBC Totes', stock: 45, unit: 'Each' },
        { id: 4, name: '2in Ball Valve with Camlock', sku: 'BV-2IN-CL', price: 26.95, image: './images/product/ibc/bv-camlock-400x400.jpg', category: 'Parts & Accessories', stock: 500, unit: 'Each' },
        { id: 5, name: 'IBC Tote Cover 600D', sku: 'COV-600D', price: 59.95, image: './images/product/ibc/cover-600d-400x400.jpg', category: 'Parts & Accessories', stock: 200, unit: 'Each' },
        { id: 6, name: '55 Gallon Steel Drum Reconditioned', sku: 'DRM-55-RCN', price: 85.00, image: './images/product/ibc/drum-55-400x400.jpg', category: 'Drums & Containers', stock: 120, unit: 'Each' }
      ],
      get filteredProducts() {
        let filtered = this.products;
        if (this.selectedCategory !== 'all') {
          filtered = filtered.filter(p => p.category === this.selectedCategory);
        }
        if (this.sortBy === 'price-low') {
          filtered = [...filtered].sort((a, b) => a.price - b.price);
        } else if (this.sortBy === 'price-high') {
          filtered = [...filtered].sort((a, b) => b.price - a.price);
        } else if (this.sortBy === 'name') {
          filtered = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
        }
        return filtered;
      },
      addToCart(product) {
        this.cartCount++;
        alert('Added to cart: ' + product.name);
      },
      formatPrice(price) {
        return '$' + price.toFixed(2);
      }
    }" x-init="
